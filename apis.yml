name: Echo AI (fka Pathlight)
description: Echo AI (formerly Pathlight) was an AI-driven customer conversation intelligence platform
  used by customer-experience and support teams to analyze support conversations, surface hidden insights,
  and coach agents. Founded as Pathlight and backed by Kleiner Perkins, Insight Partners and Quiet Capital,
  it rebranded to Echo AI in January 2024 and was acquired by contact-center workforce-engagement vendor
  Calabrio on 2024-12-11; the technology now ships inside Calabrio ONE, and calabrio.com itself now
  redirects to verint.com. The company publishes no discoverable public developer surface of its own —
  no API documentation, OpenAPI, GraphQL, MCP server, agent card or first-party SDK — and both brand
  domains are dark — pathlight.com no longer resolves and echoai.com returns a removed Framer site (HTTP
  404). The Wayback index for both domains contains no /api, /docs/api or /developer path at any point in
  their history, only legal pages. The only verified live public asset is the Pathlight GitHub
  organization, whose 62 public repositories are third-party forks plus first-party Singer.io taps that
  INGEST other vendors' APIs (Zendesk, Gorgias, Gladly, Dialpad, Five9, Kustomer) rather than any
  first-party client library. This profile is retained as an identity record; no fabricated API artifacts
  were added, and the npm/PyPI packages that share the Pathlight and Echo AI names were verified to belong
  to unrelated publishers.
